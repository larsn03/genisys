name: ci
# P0-3 (docs/IMPLEMENTATION.md §14): lint + 4-OS build matrix + race tests.
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: gofmt check
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        # go install (not the prebuilt action binary) so the linter is
        # compiled by the same Go toolchain as the module — golangci-lint
        # refuses to run when its build Go predates the module's directive.
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          $(go env GOPATH)/bin/golangci-lint run

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: build (CGO off, SPEC G12)
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o genisys-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/genisys

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: go test -race
        run: go test -race -count=1 ./...

  # e2e-mock (IMPL §14): real browser against `genisys serve` + scripted
  # OpenAI mock — SPEC M2 exit gate at the UI level.
  # SPEC Q1: native window shell must keep compiling (GTK4 + WebKitGTK 6.0)
  window:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: install webkit dev libs
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgtk-4-dev libwebkitgtk-6.0-dev pkg-config build-essential
      - name: vet + build native binary (CGO on, -tags wails)
        env: { CGO_ENABLED: "1" }
        run: |
          go vet -tags wails ./internal/desktop/
          go build -tags wails -ldflags "-s -w" -o dist/genisys-window-linux-amd64 ./cmd/genisys
      - uses: actions/upload-artifact@v4
        with: { name: window-linux, path: dist/genisys-window-linux-amd64 }

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: ui/package-lock.json }
      - name: build UI (fresh dist; go:embed)
        run: cd ui && npm ci && npm run build
      - name: build server
        env: { CGO_ENABLED: "0" }
        run: go build -o dist/genisys ./cmd/genisys
      - name: install chromium
        run: cd ui && npx playwright install --with-deps chromium
      - name: run e2e
        run: node e2e/run.mjs

  # P6-7 (SPEC §19.1/G13): AppImage is the primary artifact — build and
  # smoke-run it on every change; publish on tag via the release job.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: ui/package-lock.json }
      - name: build UI (embedded in the binary)
        run: cd ui && npm ci && npm run build
      - name: install appimagetool
        run: |
          curl -sL -o /tmp/at.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/at.AppImage
          /tmp/at.AppImage --appimage-extract
          echo "APPIAMETOOL=$GITHUB_WORKSPACE/squashfs-root/usr/bin/appimagetool" >> "$GITHUB_ENV"
          # bundled desktop-file-validate, mksquashfs, zsyncmake
          echo "$GITHUB_WORKSPACE/squashfs-root/usr/bin" >> "$GITHUB_PATH"
      - name: dist (tarballs + AppImage)
        run: make dist
      - name: smoke-run the AppImage
        run: |
          ./dist/Genisys-*-x86_64.appimage --appimage-extract-and-run serve --no-open &
          sleep 2
          curl -fsS http://127.0.0.1:8710/api/version | grep -q version
          kill %1
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, e2e, package]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
