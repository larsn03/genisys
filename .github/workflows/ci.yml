name: ci
# P0-3 (docs/IMPLEMENTATION.md §14): lint + 4-OS build matrix + race tests.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: gofmt check
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          # config: .golangci.yml (auto-detected)

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: build (CGO off, SPEC G12)
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o genisys-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/genisys

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: go test -race
        run: go test -race -count=1 ./...

  # e2e-mock (IMPL §14): real browser against `genisys serve` + scripted
  # OpenAI mock — SPEC M2 exit gate at the UI level.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: ui/package-lock.json }
      - name: build UI (fresh dist; go:embed)
        run: cd ui && npm ci && npm run build
      - name: build server
        env: { CGO_ENABLED: "0" }
        run: go build -o dist/genisys ./cmd/genisys
      - name: install chromium
        run: cd ui && npx playwright install --with-deps chromium
      - name: run e2e
        run: node e2e/run.mjs
